name: Android debug APK build

# Dedicated workflow for producing an installable debug APK for physical
# Android testing, without needing Android Studio locally.
#
# Note: android-build-apk in verify-build.yml already does an equivalent
# build on every push/PR to main. This workflow is separate and
# manually/path-triggered so testing an APK build doesn't require pushing
# to main or waiting on the full verify-build pipeline.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Ensure Android assets directory exists
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the long-removed
          # "tools" package, which sdkmanager 16+ on current runners rejects
          # ("Failed to find package 'tools'"). Install platform-tools only;
          # Gradle downloads the platform/build-tools the project needs.
          packages: "platform-tools"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: conz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
