name: Backup production database

# Manual only. Reads production, changes nothing. Produces an ENCRYPTED dump as a private artifact.
# Needs two repository secrets (Settings > Secrets and variables > Actions), set by the owner:
#   PROD_DATABASE_URL  - Supabase Dashboard > Connect > "Session pooler" connection string, with the database password
#   BACKUP_PASSPHRASE  - a long passphrase the owner keeps somewhere safe; needed to open the backup
# Restore rehearsal and how to open the file: docs/security/CONZ-BACKUP-RESTORE-PROCEDURE-2026-10-12.md

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets are present
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Set the PROD_DATABASE_URL and BACKUP_PASSPHRASE repository secrets first."; exit 1
          fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 20 ]; then
            echo "BACKUP_PASSPHRASE must be at least 20 characters."; exit 1
          fi

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump (schemas public, auth, storage metadata) and encrypt
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          /usr/lib/postgresql/17/bin/pg_dump "$PROD_DATABASE_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage --schema=supabase_migrations \
            --file="conz-prod-$STAMP.dump"
          /usr/lib/postgresql/17/bin/pg_restore --list "conz-prod-$STAMP.dump" > "conz-prod-$STAMP.contents.txt"
          echo "Objects in dump: $(grep -c . "conz-prod-$STAMP.contents.txt")"
          grep -c "TABLE DATA public jobs" "conz-prod-$STAMP.contents.txt"
          sha256sum "conz-prod-$STAMP.dump" | tee "conz-prod-$STAMP.sha256"
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" \
            --output "conz-prod-$STAMP.dump.gpg" "conz-prod-$STAMP.dump"
          shred -u "conz-prod-$STAMP.dump"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: conz-prod-backup
          path: |
            conz-prod-*.dump.gpg
            conz-prod-*.sha256
            conz-prod-*.contents.txt
          retention-days: 30
          if-no-files-found: error
