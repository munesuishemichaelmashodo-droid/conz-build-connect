name: Verify build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Security-critical code must be lint-clean. The rest of the repo still
      # carries historical formatting / `any` debt (see
      # docs/security/CONZ-HARDENING-PLAN.md, Phase 17) and is not gated yet.
      - name: Lint (security-critical code)
        run: npm run lint:security

      - name: Unit tests
        run: npm test

      - name: Build + smoke-test the compiled server
        run: npm run build

  # pgTAP security / financial tests against a FRESH local Supabase stack in
  # the runner's Docker (baseline + every later migration). No hosted project
  # and no production credentials are involved.
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase from migrations
        run: node scripts/db-test.mjs start

      - name: Run database tests (pgTAP)
        run: node scripts/db-test.mjs test

      - name: Stop local Supabase
        if: always()
        run: node scripts/db-test.mjs stop

  build-android-apk:
    runs-on: ubuntu-latest
    needs: [build-and-verify, database-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Ensure Android assets directory exists
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the long-removed
          # "tools" package, which sdkmanager 16+ on current runners rejects
          # ("Failed to find package 'tools'"). Install platform-tools only;
          # Gradle downloads the platform/build-tools the project needs.
          packages: "platform-tools"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: conz-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
